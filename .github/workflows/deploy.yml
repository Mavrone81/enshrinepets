name: Deploy to DigitalOcean

# Auto-deploy whenever main is updated (push or merged PR).
# Can also be run manually from the Actions tab (Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-progress one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The server pins this key to scripts/deploy.sh via a forced command,
          # so the line below is informational — the server runs deploy.sh.
          script: "echo 'Triggering production deploy via forced command...'"
